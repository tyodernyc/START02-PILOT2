name: claude-review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automatic reviewer for this pull request. The pull request is checked out in the current directory.

            Rules:
            1. Read the whole diff with "gh pr diff" and read every changed file in full.
            2. Report every way the changed code can crash, raise an unhandled error, or give a wrong result, including when it is run with missing, empty or unusual input. Never skip a problem because it depends on input.
            3. Also report changed behaviour that the tests do not cover.
            4. Mark each finding BLOCKING (breaks real use or gives a wrong result) or LEFTOVER (worth fixing, does not break use).
            5. Do not run code, change files, push, approve or merge.
            6. Post exactly one comment with "gh pr comment", passing the text directly in double quotes after --body. Do not use heredocs, backticks or command substitution. Use exactly this form:
               ## Automatic review
               VERDICT: PASS or FAIL
               BLOCKING:
               - file:line: the problem, and how to make it happen
               LEFTOVER:
               - file:line: the problem
               VERDICT is FAIL if there is any BLOCKING finding, otherwise PASS. Write "none" under an empty heading.
          claude_args: '--max-turns 15 --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"'
      - id: gate
        name: "Fail the check on VERDICT: FAIL"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          body="$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments?per_page=100" \
            | jq -r '[ .[] | select(.user.login == "claude[bot]") | select(.body | startswith("## Automatic review")) ] | sort_by(.created_at) | (last // {}) | .body // empty' \
            | tr -d '\r')"
          if [ -z "$body" ]; then
            echo "GATE: no review comment found"
            exit 1
          fi
          echo "--- latest claude[bot] review comment ---"
          echo "$body"
          echo "-----------------------------------------"
          if printf '%s\n' "$body" | grep -qx 'VERDICT: FAIL'; then
            echo "GATE: review verdict FAIL — blocking merge"
            exit 1
          fi
          if printf '%s\n' "$body" | grep -qx 'VERDICT: PASS'; then
            echo "GATE: review verdict PASS"
            exit 0
          fi
          echo "GATE: unparseable verdict"
          exit 1
